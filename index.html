<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>start.ng · Good vibes. Good games.</title>
<link rel="icon" href="https://start.ng/favicon.svg">
<script>document.documentElement.className += ' js play';</script>
<style>
:root{
  --bg:#f6f5ee;
  --ink:#292a23;
  --muted:#6b6c63;
  --lime:#d8fd71;
  --card:#fffef9;
  --line:#e4e2d6;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --soft:cubic-bezier(.22,1.16,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:inherit;cursor:pointer}
.container{max-width:960px;margin:0 auto}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:4px}

/* ---------- header (page context, unchanged) ---------- */
header.nav{display:flex;align-items:center;padding:12px 20px;position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:8px;margin-right:auto;font-size:1.3rem;font-weight:800;letter-spacing:-.03em}
.logo::before{content:"";display:block;width:26px;height:26px;background:url("https://start.ng/favicon.svg") center/contain no-repeat;cursor:pointer}
.logo b{font-weight:800;font-size:1.3rem;letter-spacing:-.03em}
.logo b span{color:var(--muted)}
#pages-menu{display:none;align-items:center;gap:4px}
#pages-menu a{padding:8px 10px;font-weight:700;font-size:15px;border-radius:8px}
#pages-menu a:hover{background:rgba(41,42,35,.06)}
.theme-toggle{display:none;align-items:center;gap:6px;background:none;border:0;padding:8px 10px;border-radius:8px;font-weight:700;font-size:15px}
.theme-toggle:hover{background:rgba(41,42,35,.06)}
.theme-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-account{display:contents}
.nav-menu-btn{order:2;display:flex;align-items:center;justify-content:center;width:44px;height:43px;background:none;border:1px solid var(--line);border-radius:10px;padding:0}
.nav-menu-icon{position:relative;display:block;width:18px;height:2px;background:var(--ink);border-radius:2px}
.nav-menu-icon::before,.nav-menu-icon::after{content:"";position:absolute;left:0;width:18px;height:2px;background:var(--ink);border-radius:2px}
.nav-menu-icon::before{top:-6px}
.nav-menu-icon::after{top:6px}
.nav-menu-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav-signin{order:1;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:16px}
@media (min-width:900px){
  header.nav{padding:14px 24px}
  #pages-menu{display:flex}
  .nav-menu-btn{display:none}
  .theme-toggle.theme-row{display:flex}
}

/* ---------- hero section (design unchanged) ---------- */
.hero{position:relative;padding:48px 20px 56px;text-align:center}
@media (min-width:768px){.hero{padding:72px 24px 80px}}
.eyebrow{position:relative;z-index:1;margin:0 0 22px;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:400}
@media (min-width:768px){.eyebrow{font-size:.8rem;letter-spacing:.28em}}
.hero h1{position:relative;z-index:1;margin:0 0 32px;font-size:clamp(2.8rem,9vw,6.2rem);line-height:.98;letter-spacing:-.055em;font-weight:800}
.line{display:block}
mark{
  position:relative;
  color:inherit;
  padding:0 .06em;
  background:linear-gradient(transparent 62%,var(--lime) 62%,var(--lime) 92%,transparent 92%);
  background-size:100% 100%;
  background-repeat:no-repeat;
}
mark::after{
  content:"";
  position:absolute;
  left:0;right:0;
  top:62%;height:30%;
  background:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 60%);
  background-size:320% 100%;
  background-position:200% 0;
  background-repeat:no-repeat;
  pointer-events:none;
}
.lead{position:relative;z-index:1;margin:0 0 28px;font-size:1.05rem;line-height:1.6;color:var(--muted)}
@media (min-width:768px){.lead{margin-bottom:36px;font-size:1.2rem;line-height:1.7}}
.lead code{
  background:var(--lime);
  color:var(--ink);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:.88em;
  padding:1px 6px;
  border-radius:4px;
}
.actions{position:relative;z-index:1;display:flex;justify-content:center;gap:12px}
.btn,.ghost{display:block;padding:12px 22px;border-radius:10px;font-size:16px;font-weight:700;line-height:normal}
.btn{background:var(--ink);color:#fff;border:0}
.ghost{background:var(--card);color:var(--ink);border:.667px solid var(--line)}
.btn,.ghost{transition:transform .45s var(--spring),background-color .2s ease,border-color .2s ease}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.ghost:hover{transform:translateY(-3px) scale(1.03);border-color:#d8d5c6}
.btn:active,.ghost:active{transform:translateY(0) scale(.96)}

/* ---------- motion graphics layer (added, never alters the design) ---------- */
.mg-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.mg-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.prop{position:absolute;pointer-events:none;will-change:transform}
.prop-in{
  display:block;
  animation:mg-prop-in .9s var(--spring) var(--pd) backwards,
            mg-float var(--fd) ease-in-out var(--pfd) infinite alternate;
}
.prop-in svg{display:block;width:100%;height:auto;overflow:visible}
.p1{left:5%;top:5%;width:48px}
.p2{right:7%;top:3%;width:40px}
.p3{left:2%;top:34%;width:74px}
.p4{right:3%;top:36%;width:46px}
.p5{left:7%;bottom:5%;width:36px}
.p6{right:8%;bottom:8%;width:66px}
@media (max-width:767px){
  .p3,.p4{display:none}
  .p1{width:34px;left:4%}
  .p2{width:28px}
  .p5{width:26px}
  .p6{width:48px}
}

.confetti{position:absolute;display:block;border-radius:2px;will-change:transform,opacity}
.confetti.lime{width:10px;height:10px;background:var(--lime);border:2px solid var(--ink);border-radius:50%}
.confetti.ink{width:8px;height:8px;background:var(--ink);border-radius:50%}
.confetti.card{width:11px;height:11px;background:var(--card);border:2px solid var(--ink);border-radius:3px}

.mg-replay{
  position:fixed;right:18px;bottom:18px;z-index:50;
  display:flex;align-items:center;gap:8px;
  background:var(--ink);color:#fff;border:0;border-radius:10px;
  padding:10px 16px;font-size:14px;font-weight:700;
  opacity:.86;transition:transform .45s var(--spring),opacity .2s ease;
}
.mg-replay:hover{transform:translateY(-3px) scale(1.04);opacity:1}
.mg-replay svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ----- entrance choreography (fills backwards, settles on the original values) ----- */
.js.play .eyebrow{animation:mg-rise .7s var(--soft) .05s backwards}
.js.play .line{animation:mg-line .85s var(--soft) var(--ld) backwards}
.js.play .line:nth-of-type(1){--ld:.18s}
.js.play .line:nth-of-type(2){--ld:.34s}
.js.play mark{animation:mg-wipe .7s var(--soft) .62s backwards}
.js.play .lead{animation:mg-rise .8s var(--soft) .62s backwards}
.js.play .actions .btn{animation:mg-btn .8s var(--soft) .86s backwards}
.js.play .actions .ghost{animation:mg-btn .8s var(--soft) .98s backwards}
.js.play .p1{--pd:.50s}
.js.play .p2{--pd:.60s}
.js.play .p3{--pd:.70s}
.js.play .p4{--pd:.80s}
.js.play .p5{--pd:.90s}
.js.play .p6{--pd:1.00s}

@keyframes mg-rise{
  from{opacity:0;transform:translateY(26px) scale(.95)}
  60%{opacity:1}
  to{opacity:1;transform:none}
}
@keyframes mg-line{
  0%{opacity:0;transform:translateY(52px) rotate(-2deg) scale(.9)}
  60%{opacity:1;transform:translateY(-6px) rotate(.5deg) scale(1.015)}
  100%{opacity:1;transform:none}
}
@keyframes mg-btn{
  0%{opacity:0;transform:translateY(30px) scale(.5,1.4)}
  55%{opacity:1;transform:translateY(-5px) scale(1.12,.9)}
  78%{transform:translateY(0) scale(.97,1.03)}
  100%{opacity:1;transform:none}
}
@keyframes mg-wipe{
  from{background-size:0% 100%}
  to{background-size:100% 100%}
}
@keyframes mg-prop-in{
  0%{opacity:0;transform:scale(0) rotate(-50deg)}
  65%{opacity:1;transform:scale(1.18) rotate(6deg)}
  100%{opacity:1;transform:none}
}

/* ----- ambient loops ----- */
@keyframes mg-float{
  from{translate:0 0;rotate:0deg}
  to{translate:0 var(--amp,-14px);rotate:var(--spin,7deg)}
}
.p1{--amp:-13px;--spin:-8deg;--fd:5.2s;--pfd:1.9s}
.p2{--amp:-16px;--spin:10deg;--fd:4.4s;--pfd:2.4s}
.p3{--amp:-11px;--spin:5deg;--fd:6s;--pfd:2.1s}
.p4{--amp:-15px;--spin:-9deg;--fd:5s;--pfd:2.7s}
.p5{--amp:-12px;--spin:12deg;--fd:4.8s;--pfd:2.3s}
.p6{--amp:-14px;--spin:-6deg;--fd:5.6s;--pfd:2.9s}
.js.play mark::after{animation:mg-gloss 6s linear 2.4s infinite}
.js.play .lead code{animation:mg-chip 7s ease-in-out 3.2s infinite}
@keyframes mg-gloss{
  0%{background-position:200% 0}
  26%{background-position:-200% 0}
  100%{background-position:-200% 0}
}
@keyframes mg-chip{
  0%,86%,100%{box-shadow:0 0 0 0 rgba(216,253,113,0)}
  91%{box-shadow:0 0 0 7px rgba(216,253,113,.75)}
  96%{box-shadow:0 0 0 0 rgba(216,253,113,0)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none !important;
    transition:none !important;
  }
}
</style>
</head>
<body>

<header class="container nav">
  <a class="logo" href="/"><b>start<span>.ng</span></b></a>
  <nav id="pages-menu" aria-label="Pages">
    <a href="/games">Games</a>
    <a href="/tournament">Tournament</a>
    <a href="/creators">Creators</a>
    <a href="/docs">Docs</a>
    <button type="button" class="theme-toggle theme-row" aria-label="Switch to dark mode" title="Dark mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      Dark mode
    </button>
  </nav>
  <div class="nav-account">
    <button type="button" class="nav-menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="pages-menu">
      <span aria-hidden="true" class="nav-menu-icon"></span>
      <span class="nav-menu-text">Menu</span>
    </button>
    <button type="button" class="theme-toggle" aria-label="Switch to dark mode" title="Dark mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
    </button>
    <button class="nav-signin">Sign in</button>
  </div>
</header>

<main>
  <section class="container hero" id="hero">

    <div class="mg-layer" aria-hidden="true">
      <span class="prop p1"><span class="prop-in">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="#d8fd71" stroke="#292a23" stroke-width="3"/></svg>
      </span></span>

      <span class="prop p2"><span class="prop-in">
        <svg viewBox="0 0 40 40"><path d="M20 1c2.2 11 6.8 15.6 17.8 17.8C26.8 21 22.2 25.6 20 36.6 17.8 25.6 13.2 21 2.2 18.8 13.2 16.6 17.8 12 20 1Z" fill="#d8fd71" stroke="#292a23" stroke-width="2.4" stroke-linejoin="round"/></svg>
      </span></span>

      <span class="prop p3"><span class="prop-in">
        <svg viewBox="0 0 74 26"><path d="M4 19C11 4 18 4 25 19s14 15 21 0 14-15 21-3" fill="none" stroke="#292a23" stroke-width="3.4" stroke-linecap="round"/></svg>
      </span></span>

      <span class="prop p4"><span class="prop-in">
        <svg viewBox="0 0 46 46">
          <rect x="3" y="3" width="40" height="40" rx="11" fill="#fffef9" stroke="#292a23" stroke-width="3"/>
          <circle cx="15" cy="15" r="3.4" fill="#292a23"/>
          <circle cx="31" cy="31" r="3.4" fill="#292a23"/>
          <circle cx="23" cy="23" r="3.4" fill="#d8fd71" stroke="#292a23" stroke-width="2"/>
        </svg>
      </span></span>

      <span class="prop p5"><span class="prop-in">
        <svg viewBox="0 0 36 36"><path d="M18 2.5l4.9 10.3 11.3 1.5-8.3 7.8 2.2 11.2L18 28.1 7.9 33.3l2.2-11.2L1.8 14.3l11.3-1.5L18 2.5Z" fill="#d8fd71" stroke="#292a23" stroke-width="2.6" stroke-linejoin="round"/></svg>
      </span></span>

      <span class="prop p6"><span class="prop-in">
        <svg viewBox="0 0 66 16">
          <circle cx="8" cy="8" r="6" fill="#292a23"/>
          <circle cx="33" cy="8" r="6.5" fill="#d8fd71" stroke="#292a23" stroke-width="2.4"/>
          <circle cx="58" cy="8" r="6" fill="#292a23"/>
        </svg>
      </span></span>
    </div>

    <p class="eyebrow">Big imagination. Played everywhere.</p>

    <h1>
      <span class="line">Good vibes.</span>
      <span class="line"><mark>Good games.</mark></span>
    </h1>

    <p class="lead">Games made by builders in the community. <br>Each one lives at its own address, like <a href="https://lagos-legends-street-quest.start.ng" target="_blank" rel="noreferrer"><code>lagos-legends-street-quest.start.ng</code></a>. <br>Pick one and play right in your browser.</p>

    <div class="actions">
      <a class="btn" href="#games">Play now</a>
      <button class="ghost">Create free account</button>
    </div>

    <div class="mg-fx" aria-hidden="true"></div>
  </section>
</main>

<button class="mg-replay" type="button" aria-label="Replay the motion">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
  Replay motion
</button>

<script>
(function () {
  var root = document.documentElement;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ---- replay the entrance choreography ---- */
  function replay() {
    if (reduced.matches) return;
    root.classList.remove('play');
    void document.body.offsetWidth;
    root.classList.add('play');
  }
  document.querySelector('.mg-replay').addEventListener('click', replay);
  window.addEventListener('keydown', function (e) {
    if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey) replay();
  });

  /* ---- pointer parallax on the floating props ---- */
  var props = Array.prototype.slice.call(document.querySelectorAll('.prop'));
  var depths = [16, 22, 12, 18, 20, 14];
  var tx = 0, ty = 0, raf = null;

  function paint() {
    raf = null;
    for (var i = 0; i < props.length; i++) {
      var d = depths[i % depths.length];
      props[i].style.transform = 'translate3d(' + (tx * d).toFixed(2) + 'px,' + (ty * d).toFixed(2) + 'px,0)';
    }
  }
  function onMove(e) {
    if (reduced.matches) return;
    tx = (e.clientX / window.innerWidth - 0.5) * 2;
    ty = (e.clientY / window.innerHeight - 0.5) * 2;
    if (raf === null) raf = requestAnimationFrame(paint);
  }
  window.addEventListener('pointermove', onMove, { passive: true });

  /* ---- confetti burst on "Play now" ---- */
  var fx = document.querySelector('.mg-fx');
  var kinds = ['lime', 'ink', 'card'];

  function burst(anchor) {
    if (reduced.matches) return;
    var lr = fx.getBoundingClientRect();
    var r = anchor.getBoundingClientRect();
    var cx = r.left - lr.left + r.width / 2;
    var cy = r.top - lr.top + r.height / 2;

    anchor.animate(
      [{ transform: 'scale(1,1)' }, { transform: 'scale(1.14,.86)' }, { transform: 'scale(.96,1.05)' }, { transform: 'scale(1,1)' }],
      { duration: 520, easing: 'cubic-bezier(.3,1.4,.5,1)' }
    );

    for (var i = 0; i < 28; i++) {
      var p = document.createElement('i');
      p.className = 'confetti ' + kinds[i % kinds.length];
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      fx.appendChild(p);

      var ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.5;
      var vel = 90 + Math.random() * 170;
      var dx = Math.cos(ang) * vel;
      var dy = Math.sin(ang) * vel;
      var spin = (Math.random() * 720 - 360) | 0;

      var anim = p.animate([
        { transform: 'translate(-50%,-50%) translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
        { transform: 'translate(-50%,-50%) translate(' + dx + 'px,' + (dy + 60) + 'px) rotate(' + spin + 'deg) scale(.9)', opacity: 1, offset: 0.55 },
        { transform: 'translate(-50%,-50%) translate(' + (dx * 1.15) + 'px,' + (dy + 230) + 'px) rotate(' + (spin * 1.3) + 'deg) scale(.5)', opacity: 0 }
      ], { duration: 1000 + Math.random() * 550, easing: 'cubic-bezier(.2,.7,.35,1)' });
      anim.onfinish = function (node) { return function () { node.remove(); }; }(p);
    }
  }

  var playBtn = document.querySelector('.actions .btn');
  var ghostBtn = document.querySelector('.actions .ghost');

  playBtn.addEventListener('click', function (e) {
    e.preventDefault();
    burst(playBtn);
  });

  ghostBtn.addEventListener('click', function () {
    if (reduced.matches) return;
    ghostBtn.animate(
      [{ transform: 'scale(1,1)' }, { transform: 'scale(.9,1.12)' }, { transform: 'scale(1.06,.95)' }, { transform: 'scale(1,1)' }],
      { duration: 620, easing: 'cubic-bezier(.3,1.5,.5,1)' }
    );
    burst(ghostBtn);
  });
})();
</script>

</body>
</html>
